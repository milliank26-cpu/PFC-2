
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Random Food Selector</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
 <h1>Randomization Lab</h1>
 <label for="countInput">How many items should I pick?</label>
 <input id="countInput" type="number" min="1" max="6" value="2">
 <button id="pickButton" type="button">Pick items</button>
 <p id="result" aria-live="polite">Your results will appear here.</p>
  </main>
</body>
</html>
